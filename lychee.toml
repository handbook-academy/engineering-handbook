cache = true
verbose = "info"
no_progress = false

exclude_path = [
  "node_modules",
  "site/dist",
  ".git",
  "docs",
]

# Accept 2xx, 403/406 (ACM/IEEE/Springer/Uber block HEAD requests),
# 401 (Reuters paywall — content exists), 429 (rate limit).
accept = [200, 201, 202, 203, 204, 206, 401, 403, 406, 429]

# Retry settings.
max_retries = 2
retry_wait_time = 5

# Timeout per URL.
timeout = 30

# User-Agent for requests (avoids 403s from some servers).
user_agent = "lychee-action/Engineering-Handbook-CI (+https://github.com/handbook-academy/engineering-handbook)"

# Exclude known-finicky domains where heuristic validation is unreliable.
exclude = [
  # LinkedIn blocks unauthenticated HEAD requests
  "https://www.linkedin.com/",
  # Twitter/X requires auth for most paths
  "https://x.com/",
  "https://twitter.com/",
  # Some vendor docs rate-limit aggressively
  "https://docs.oracle.com/",
  # Hosts with broken HTTP/2 implementations that lychee's HTTP/2 client
  # cannot negotiate. URLs work fine in browsers (HTTP/1.1 fallback).
  "https://www.cbc.ca/",
  "https://www.nasdaq.com/",
  # Transient TLS CloseNotify; archive URL sits next to the primary in the footnote.
  "https://newsroom.tiktok.com/",
  # Intermittently refuse connections from GitHub-hosted runners ("Connection
  # failed" / timeouts) while serving the same pages to browsers. Passed in
  # earlier CI runs, so these are runner-IP blocks, not dead links.
  "https://etcd.io/",
  "https://istio.io/",
  "https://weaviate.io/",
  # Certificate chain not trusted by lychee's TLS client; pages load fine in
  # browsers, which fetch the missing intermediate certificate.
  "https://db-engines.com/",
  "https://web.eecs.utk.edu/",
]

# Don't check mail links.
include_mail = false
