name: Claim a Chapter
description: Announce that you are writing a specific chapter (reserves it to avoid duplicate work)
title: "Writing: "
labels: ["content: writing", "in progress"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for volunteering to write a chapter! This issue reserves the topic
        so no one else duplicates your work. Please read [CONTRIBUTING.md](https://github.com/handbook-academy/engineering-handbook/blob/main/CONTRIBUTING.md)
        and [STYLE_GUIDE.md](https://github.com/handbook-academy/engineering-handbook/blob/main/STYLE_GUIDE.md) before starting.
  - type: dropdown
    id: book
    attributes:
      label: Which book?
      options:
        - HLD Handbook (content/hld/)
        - DSA Handbook (content/dsa/)
        - AI Engineering Handbook (content/ai-eng/)
    validations:
      required: true
  - type: input
    id: chapter
    attributes:
      label: Chapter title
      placeholder: "Distributed Tracing at Scale"
    validations:
      required: true
  - type: input
    id: part
    attributes:
      label: Part
      description: |
        HLD parts: Part 0 (Prerequisites) - Part 11 (Interview Framework), or Trade-offs Library.
        DSA parts: Part 0 (Foundations) - Part 14 (Interview Framework), or Patterns / Editorials.
        AI Engineering parts: Part 0 (Start Here) - Part 11 (AI Product Engineering).
      placeholder: "HLD Part 6 - Reliability & Operations"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Planned scope
      description: What topics will you cover? How deep will you go?
    validations:
      required: true
  - type: input
    id: word_count
    attributes:
      label: Expected word count
      placeholder: "3,500-4,500"
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: Self-imposed deadline
      description: When do you expect to submit the PR?
      placeholder: "2 weeks from today"
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: Your background with this topic
      description: Have you built/operated systems related to this chapter?
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I have read CONTRIBUTING.md and STYLE_GUIDE.md
          required: true
        - label: I understand the chapter template requirements (frontmatter, diagrams, citations, flashcards)
          required: true
        - label: I will submit a draft PR within my stated deadline or notify maintainers if delayed
          required: true
