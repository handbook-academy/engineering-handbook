[files]
extend-exclude = [
  "*.excalidraw",
  "*.svg",
  "*.png",
  "*.jpg",
  "node_modules/**",
  "site/dist/**",
  ".git/**",
  "docs/**",
  "LICENSE",
  "package-lock.json",
]

[default]
extend-ignore-identifiers-re = [
  # Ignore identifiers that look like technical terms (e.g. crc32, sha256, utf8)
  "^[a-z]+[0-9]+$",
  # Ignore hex hashes
  "^[0-9a-f]{7,}$",
]
